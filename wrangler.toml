name = "cross-device-sync"
main = "src/index.ts"
compatibility_date = "2025-01-01"
routes = [{ pattern = "a-chai.de5.net", custom_domain = true }]
workers_dev = true

# 预览/生产环境共用的变量（非机密）
[vars]
ALLOW_ORIGIN = "*"

# KV 命名空间（已创建：SYNC_KV）
[[kv_namespaces]]
binding = "SYNC_KV"
id = "a04c41a10fc748e7a34e631d5a29e27e"

# 机密（不要在文件里写死）：
#   npx wrangler secret put SYNC_TOKEN
# 或在 Cloudflare 控制台 Workers -> Settings -> Variables and Secrets 添加

[observability]
enabled = true

# 大陆访问：Custom Domain 已在文件顶部（第 4 行）顶层声明 routes。
# 换域名时只改那一行；客户端改 API_BASE_URL。方案与排障见 docs/ACCESS_CN.md。
