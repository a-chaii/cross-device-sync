name = "cross-device-sync"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 预览/生产环境共用的变量（非机密）
[vars]
ALLOW_ORIGIN = "*"

# KV 命名空间（已创建：SYNC_KV）
[[kv_namespaces]]
binding = "SYNC_KV"
id = "a04c41a10fc748e7a34e631d5a29e27e"

# 机密（不要在文件里写死）：
#   npx wrangler secret put SYNC_TOKEN
# 或在 Cloudflare 控制台 Workers -> Settings -> Variables and Secrets 添加

[observability]
enabled = true

# ── 大陆访问：绑自有域名（推荐，workers.dev 在国内被 DNS 污染）──────────────
# 前提：域名已托管到 Cloudflare（注册商处把 NS 改成 xxx.ns.cloudflare.com）。
# 取消下面注释，把 sync.example.com 换成你的域名，再 npx wrangler deploy 即可；
# Custom Domain 会自动签发证书，workers.dev 与自定义域同时可用。
# routes = [{ pattern = "sync.example.com", custom_domain = true }]
